name: Validate benchmark reporting

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_run_id:
        description: 'Optional successful benchmark run to re-render (no new measurements)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install matplotlib packaging
      - run: python -m unittest discover -s tests -v
      - name: Regenerate historical charts from recorded measurements
        run: |
          python - <<'PY'
          from src.history import plotHistoryTrends
          for resolution in ('360p', '720p'):
              plotHistoryTrends(f'history/{resolution}_history.json', f'history/{resolution}_trend.png', resolution)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-historical-charts
          path: history/*_trend.png
          if-no-files-found: error
      - name: Re-render recorded benchmark artifacts
        if: inputs.benchmark_run_id != '' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_RUN_ID: ${{ inputs.benchmark_run_id }}
        run: |
          gh run download "$BENCHMARK_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "benchmark-${BENCHMARK_RUN_ID}-*" --dir benchmark-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reporting import createPerformanceDiagram
          from src.history import plotHistoryTrends
          for path in Path('benchmark-artifacts').rglob('*_results.json'):
              createPerformanceDiagram(json.loads(path.read_text()), path.with_name(path.name.replace('_results.json', '_diagram.png')))
          for path in Path('benchmark-artifacts').rglob('*_history.json'):
              resolution = path.name.removesuffix('_history.json')
              plotHistoryTrends(str(path), str(path.with_name(f'{resolution}_trend.png')), resolution)
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.benchmark_run_id != '' && github.event_name == 'workflow_dispatch'
        with:
          name: verified-chart-replay
          path: benchmark-artifacts/
          if-no-files-found: error

  nelux:
    if: inputs.benchmark_run_id == '' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BENCHMARK_RUNNER: ubuntu-24.04-github-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-benchmark
      - name: Decode a known clip and check runner identity
        run: |
          ffmpeg -y -f lavfi -i testsrc2=size=320x180:rate=24 -t 2 -c:v libx264 /tmp/nelux-smoke.mp4
          python - <<'PY'
          import os
          from main import getRunnerInfo
          from src.backends.celuxdecoder import decodeWithCeLux
          result = decodeWithCeLux('/tmp/nelux-smoke.mp4')
          assert 'error' not in result, result
          assert result['frameCount'] == 48, result
          assert result['fps'] > 0, result
          assert getRunnerInfo()['runner'] == os.environ['BENCHMARK_RUNNER']
          PY
