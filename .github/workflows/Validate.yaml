name: Validate benchmark reporting

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install matplotlib
      - run: python -m unittest discover -s tests -v

  nelux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install current benchmark runtime
        run: |
          sudo mkdir -p /opt/ffmpeg
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz | sudo tar -xJf - -C /opt/ffmpeg --strip-components=1
          echo '/opt/ffmpeg/lib' | sudo tee /etc/ld.so.conf.d/zz-ffmpeg.conf
          sudo ldconfig
          echo '/opt/ffmpeg/bin' >> "$GITHUB_PATH"
          echo 'LD_LIBRARY_PATH=/opt/ffmpeg/lib' >> "$GITHUB_ENV"
          pip install torch numpy
          pip install https://github.com/NevermindNilas/Nelux/releases/download/v0.9.2/nelux-0.9.2-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      - name: Verify Nelux loads
        run: python -c "import torch; from nelux import VideoReader; print(VideoReader)"
      - name: Inspect native dependencies on failure
        if: failure()
        run: find /opt/hostedtoolcache/Python -path '*/nelux/*.so' -exec ldd {} \;
