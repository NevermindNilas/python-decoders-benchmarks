name: BiWeekly Benchmark Run

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Timed iterations per decoder'
        required: false
        default: '3'
      warmup:
        description: 'Warmup iterations per decoder'
        required: false
        default: '1'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BENCHMARK_RUNS: ${{ github.event.inputs.runs || '3' }}
      BENCHMARK_WARMUP: ${{ github.event.inputs.warmup || '1' }}
      BENCHMARK_RUNNER: ubuntu-24.04-github-hosted
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-benchmark
      - name: Test reporting
        run: python -m unittest discover -s tests -v
      - name: Remove previous generated charts
        run: rm -f 360p_results.json 720p_results.json 360p_diagram.png 720p_diagram.png history/360p_trend.png history/720p_trend.png
      - name: Run benchmark
        run: python main.py --runs "${BENCHMARK_RUNS}" --warmup "${BENCHMARK_WARMUP}"
      - name: Validate measurements before publication
        run: python -m src.validate_results
      - name: Prepare release notes
        id: release
        run: |
          date=$(date -u +'%Y-%m-%d')
          tag="benchmark-${date}-${GITHUB_RUN_ID}"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "Biweekly performance measurements from ${date}."
            echo
            echo "Runner pool: ${BENCHMARK_RUNNER}. Hosted machines can vary; trends are observational, not controlled regression tests."
            echo
            echo "${BENCHMARK_RUNS} timed iterations + ${BENCHMARK_WARMUP} warmup; median FPS with min–max whiskers."
            echo
            echo "[Actions run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · Source commit: ${GITHUB_SHA}"
            for resolution in 360p 720p; do
              echo
              echo "### ${resolution}"
              echo "![${resolution} performance](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${resolution}_diagram.png)"
              echo "![${resolution} history](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${resolution}_trend.png)"
              echo
              cat "${resolution}_results_frame_count_comparison.md"
            done
            echo
            echo "JSON attachments include package versions, input checksums, CPU details, per-iteration measurements and history. Historical hardware was not recorded; those runs are grouped separately. Unavailable decoders are listed explicitly and appear as gaps in trends."
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements and charts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            360p_results.json
            720p_results.json
            360p_diagram.png
            720p_diagram.png
            *_results_frame_count_comparison.md
            history/
            release-notes.md
      - name: Commit updated history
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if ! git diff --cached --quiet; then
            git commit -m "chore(benchmark): update history ${{ steps.release.outputs.date }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Benchmark Results ${{ steps.release.outputs.date }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            360p_results.json
            720p_results.json
            360p_diagram.png
            720p_diagram.png
            360p_results_frame_count_comparison.md
            720p_results_frame_count_comparison.md
            history/360p_history.json
            history/720p_history.json
            history/360p_trend.png
            history/720p_trend.png
