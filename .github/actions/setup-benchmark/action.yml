name: Install benchmark runtime
description: Shared runtime for validation and scheduled measurements
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: pip
    - name: Install FFmpeg shared runtime
      shell: bash
      run: |
        sudo mkdir -p /opt/ffmpeg
        curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz | sudo tar -xJf - -C /opt/ffmpeg --strip-components=1
        echo '/opt/ffmpeg/lib' | sudo tee /etc/ld.so.conf.d/zz-ffmpeg.conf
        sudo ldconfig
        echo '/opt/ffmpeg/bin' >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=/opt/ffmpeg/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Install and verify matching Nelux wheel
      shell: bash
      run: python -m src.install_nelux
